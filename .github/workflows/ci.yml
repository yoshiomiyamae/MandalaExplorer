name: CI

on:
  # Only the default branch. An unfiltered push trigger fires again for every
  # branch that has a pull request open, so the same commit is built twice:
  # two identical runs and two results to read. It costs nothing in money --
  # standard runners are free for public repositories, billable minutes on a
  # run here come back empty -- but the duplicates compete for the same
  # concurrent-job allowance, and pull_request already covers work in progress.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, declared here rather than relied on from the repository
# setting: a fork inherits the file but not the setting, and a setting can be
# changed later without anyone rereading this workflow. Nothing here writes to
# the repository.
permissions:
  contents: read

# A superseded run is wasted work. Runs on the default branch are left alone,
# so every commit that lands keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing here and turn a bare test failure into something
  # actionable without a second run.
  RUST_BACKTRACE: 1

# Three jobs rather than one, because they are independent and a run then
# costs the longest of them instead of the sum. Measured on a warm cache, the
# single job took 473 seconds: 30 to lint, 212 to test, 119 to build, and the
# rest setting up. Split, the release build finishes inside the time the tests
# take and so costs nothing at all -- which is why it is still here. It catches
# what a debug build does not, and dropping it would only move that discovery
# to the tag, where it is expensive.
#
# The cost is three machines instead of one. Standard runners are free for
# public repositories, so this is paid for in cache storage and nothing else.
jobs:
  lint:
    # Windows only, and not by preference: decoding goes through Media
    # Foundation, so there is nothing to build anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Clippy gets a cache of its own, and must not share the one the
          # tests use. It runs rustc through clippy-driver, which changes the
          # fingerprint cargo records for every unit, so nothing it leaves
          # behind can be reused by a plain cargo test -- and because this job
          # is the quickest it would win the race to write a shared key and
          # keep the tests' real artifacts from ever being saved. That is not
          # a guess: v0.3.0's release restored a clippy-written cache, logged
          # `full match: true`, and still spent 978 seconds compiling.
          shared-key: lint

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Shared with the release workflow's tests, which is the point: a
          # tag reads the default branch's caches, so what a merge to main
          # compiles here is what a release starts from.
          shared-key: test

      # The Media Foundation tests synthesise an H.264 clip and decode it back.
      # A runner without an encoder, or without a GPU to make a D3D11 device on,
      # skips those rather than failing: the point of the suite is to catch our
      # own regressions, not to assert what Microsoft installed on the image.
      - name: Test
        run: cargo test --workspace

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # The release profile builds into its own directory and shares no
          # artifacts with debug, so it needs a cache of its own -- shared in
          # turn with the packaging job that a tag runs.
          shared-key: release

      # Built but not kept. On a public repository an uploaded executable is a
      # download link for anyone who finds the run -- which is the application
      # being sold.
      - name: Build
        run: cargo build --release -p mandala-app
