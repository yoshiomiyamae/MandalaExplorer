name: CI

on:
  # Only the default branch. An unfiltered push trigger fires again for every
  # branch that has a pull request open, so the same commit is built twice:
  # two identical runs and two results to read. It costs nothing in money --
  # standard runners are free for public repositories, billable minutes on a
  # run here come back empty -- but the duplicates compete for the same
  # concurrent-job allowance, and pull_request already covers work in progress.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, declared here rather than relied on from the repository
# setting: a fork inherits the file but not the setting, and a setting can be
# changed later without anyone rereading this workflow. Nothing here writes to
# the repository.
permissions:
  contents: read

# A superseded run is wasted work. Runs on the default branch are left alone,
# so every commit that lands keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing here and turn a bare test failure into something
  # actionable without a second run.
  RUST_BACKTRACE: 1

jobs:
  check:
    # Windows only, and not by preference: decoding goes through Media
    # Foundation, so there is nothing to build anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches the registry and the dependency half of target/, which is most
      # of the build: the first run took 25 minutes cold. Saved even when a
      # step fails, so a red clippy run does not make the next one start over.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Media Foundation tests synthesise an H.264 clip and decode it back.
      # A runner without an encoder, or without a GPU to make a D3D11 device on,
      # skips those rather than failing: the point of the suite is to catch our
      # own regressions, not to assert what Microsoft installed on the image.
      - name: Test
        run: cargo test --workspace

      # Built but not kept. A release build catches what a debug one does not,
      # and on a public repository an uploaded executable is a download link
      # for anyone who finds the run -- which is the application being sold.
      - name: Build
        run: cargo build --release -p mandala-app
