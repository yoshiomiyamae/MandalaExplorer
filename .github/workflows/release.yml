name: Release

# Tagging is the whole trigger: `git tag v0.3.0 && git push --tags` produces a
# release carrying the MSIX to upload to Partner Center. Submitting it is still
# manual, because the Store's automated update path -- the msstore CLI and the
# action that wraps it -- is documented as supporting free products only, and
# this one is priced per market.
on:
  push:
    tags: ['v*']

# Read by default; only the job that creates the release is given more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Split the way CI is, and for the same reason: testing and packaging need
# nothing from each other, so a release costs the longer of them rather than
# both. It used to take 1338 seconds, of which 863 were tests that began by
# compiling the whole tree from scratch -- the cache key included the job name,
# so this workflow could never reach what CI had already built. The jobs below
# name their caches after the profile instead, and a tag reads the default
# branch's caches, so the tests here start from what the merge to main left
# behind.
jobs:
  # Cheap and first: a tag that disagrees with the source is worth catching
  # before anything spends a runner on it. No toolchain, so it costs seconds.
  meta:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version out of the tag
        id: version
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          semver=${tag#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z $cargo ]]; then
            echo 'Cargo.toml has no version line' >&2
            exit 1
          fi
          if [[ $cargo != "$semver" ]]; then
            echo "Tag says $semver but Cargo.toml says $cargo. Bump one of them." >&2
            exit 1
          fi
          echo "Both say $semver"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          # The manifest takes four parts and the Store insists the fourth is 0.
          echo "package=$semver.0" >> "$GITHUB_OUTPUT"

  # A release is the one build people install, so it is tested here rather than
  # trusted to have passed on main. Nothing it produces is needed downstream --
  # it is a veto, and it runs while the package is being built.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: debug
      - name: Test
        run: cargo test --workspace

  package:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release

      # build-msix.ps1 draws all 78 icon assets with Pillow rather than keeping
      # that many PNGs in the repository. The runner has Python; it does not
      # have Pillow, and the first tagged build found that out the hard way.
      - name: Install Pillow, which the icon assets are drawn with
        run: python -m pip install --quiet --disable-pip-version-check pillow

      # This also runs cargo build --release, so there is no separate build step.
      - name: Package
        shell: pwsh
        run: .\packaging\build-msix.ps1 -Version ${{ needs.meta.outputs.package }}

      # The package has been stale before: an MSIX went to Partner Center
      # holding a binary five commits behind, and nothing said so. Comparing
      # the packaged executable against the one just built makes that loud.
      - name: The package must hold the binary just built
        shell: pwsh
        run: |
          $built = (Get-FileHash target/release/mandala.exe -Algorithm SHA256).Hash
          $packed = (Get-FileHash target/msix/layout/mandala.exe -Algorithm SHA256).Hash
          if ($built -ne $packed) {
            throw "Packaged $packed but built $built"
          }
          "Both are $built"

      - name: Name the asset after the version
        shell: pwsh
        run: |
          Copy-Item target/msix/MandalaExplorer.msix `
            "MandalaExplorer-${{ needs.meta.outputs.semver }}.msix"

      # Handed to the publishing job. The package only: the application is sold
      # in the Store, and a release that hands out a ready-to-run executable
      # undercuts that -- the source is MIT and anyone may build it, but
      # building it is not the same as clicking a download link. The MSIX is
      # published on the release page in a moment anyway, so carrying it
      # between jobs exposes nothing that is not about to be public.
      - uses: actions/upload-artifact@v7
        with:
          name: msix
          path: MandalaExplorer-${{ needs.meta.outputs.semver }}.msix
          if-no-files-found: error
          retention-days: 1

  publish:
    # Only after the tests have passed. Packaging alone is not enough to
    # publish on: the package would be well-formed and possibly broken.
    needs: [meta, verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: msix

      # gh is already on the runner, which saves depending on a third-party
      # action for one command.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.semver }}
        shell: bash
        run: |
          notes=$(cat <<NOTES
          ## Files

          | | |
          | --- | --- |
          | \`MandalaExplorer-$VERSION.msix\` | The Store package, kept here so a submission can be traced back to the commit it came from. Deliberately unsigned: Partner Center signs it and rejects one that arrives signed, so it is not installable by double-clicking. |

          To install the application, use [the Microsoft Store](https://apps.microsoft.com/detail/9P93GF7J2R94).

          Windows 10 version 2004 or later, 64-bit. Editions without Media Foundation (the N editions, unless the Media Feature Pack is installed) show still thumbnails and cannot play video.
          NOTES
          )
          gh release create "${{ github.ref_name }}" \
            "MandalaExplorer-$VERSION.msix" \
            --repo "${{ github.repository }}" \
            --title "Mandala Explorer $VERSION" \
            --notes "$notes"
